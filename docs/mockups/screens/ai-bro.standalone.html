<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ветеран PRO — AI-бро (чат зі стрімінгом)</title>
<style>
/* ============================================================
   Ветеран PRO — shared dark/MoVA brand foundation for mockups
   Every per-screen mockup MUST link this file and reuse these
   tokens + base components so all screens stay consistent.
   Charcoal "inverse/memorial" surface · single orange accent ·
   khaki/warm-gray/light category tints · square corners ·
   FLAT LINE ICONS in nav & catalogue · emoji only in content.
   Font is Inter (stand-in for the licensed e-Ukraine).
   ============================================================ */
:root{
  /* surface darkened per feedback (warm near-black derived from brand charcoal);
     cards keep the previous charcoal tone so they lift off the background */
  --bg:#1A1714; --card:#322D2A; --card2:#3C3633; --line:#473F3B;
  --text:#E9E4E3; --muted:#A89F98; --faint:#7A736D;
  --accent:#EE754D; --accentPress:#C9531F;
  --khaki:#B0AB75; --warmgray:#A19388; --light:#E6E88F;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;}

/* ── phone shell (reuse verbatim so all screens are the same size) ── */
.phone{width:320px;height:680px;background:var(--bg);border-radius:36px;border:7px solid #0e0d09;
  box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--text);}
.notch{height:24px;flex:none;display:flex;justify-content:center;align-items:flex-end;}
.notch i{width:100px;height:18px;background:#0e0d09;border-radius:0 0 12px 12px;}
.scr{flex:1;overflow-y:auto;padding:8px 16px 78px;}
.scr::-webkit-scrollbar{display:none;}

/* ── shared type & components ── */
.h1{font-size:21px;font-weight:600;letter-spacing:-.01em;}
.h2{font-size:16px;font-weight:600;}
.sub{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:4px;}
.sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 9px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;}
.row{display:flex;align-items:center;gap:11px;}
.grow{flex:1;min-width:0;}
.meta{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
.btn{display:block;width:100%;background:var(--accent);color:#241200;border:none;border-radius:8px;
  padding:13px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;margin-top:6px;}
.btn:active{background:var(--accentPress);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500;}
.skip{display:block;text-align:center;color:var(--muted);font-size:12.5px;margin-top:12px;
  background:none;border:none;width:100%;text-decoration:underline;cursor:pointer;}
.pill{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);}
.pill.ok{color:#caa15a;border-color:#5a4716;}
.bar{height:7px;background:var(--card2);border-radius:999px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;}
.em{font-size:21px;flex:none;}
.tile{width:40px;height:40px;border-radius:9px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;flex:none;color:var(--text);}
.tile i{font-size:21px;color:var(--khaki);}

/* ── bottom nav · FLAT LINE ICONS, never emoji ── */
.nav{position:absolute;bottom:0;left:0;right:0;height:60px;background:rgba(26,23,20,.98);
  border-top:1px solid var(--line);display:flex;}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10px;text-decoration:none;position:relative;cursor:pointer;}
.nav a i{font-size:21px;}
.nav a.on{color:var(--accent);}
.nav a.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;background:var(--accent);border-radius:0 0 3px 3px;}

</style>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── page chrome (mockup frame only — shell/tokens come from _brand.css) ── */
body{background:#17150f;color:var(--text);min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:34px 20px;}
.cap{font-size:12px;color:#8a8079;text-align:center;max-width:300px;line-height:1.45;margin-top:14px;}
.cap b{color:#c7bdb5;font-weight:600;}

/* ── slim chat header inside the phone ── */
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--line);flex:none;}
.bavatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#241200;}
.bavatar i{font-size:20px;}
.chead .name{font-size:14.5px;font-weight:600;line-height:1.1;}
.chead .stat{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;}
.chead .dot{width:7px;height:7px;border-radius:50%;background:var(--khaki);display:inline-block;}

/* ── messages area (replaces .scr padding feel; calm + generous) ── */
.msgs{flex:1;overflow-y:auto;padding:16px 16px 78px;display:flex;flex-direction:column;gap:14px;}
.msgs::-webkit-scrollbar{display:none;}

/* ── chat bubbles ── */
.brow{display:flex;align-items:flex-end;gap:8px;max-width:100%;}
.brow.user{justify-content:flex-end;}
.bmini{width:26px;height:26px;border-radius:50%;flex:none;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#241200;}
.bmini i{font-size:14px;}
.bubble{font-size:13.5px;line-height:1.5;padding:10px 13px;max-width:230px;}
.bubble.bot{background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:13px;border-top-left-radius:4px;}
.bubble.user{background:var(--accent);color:#241200;border-radius:13px;border-top-right-radius:4px;font-weight:500;}

/* blinking stream cursor */
.cursor{display:inline-block;width:7px;color:var(--accent);font-weight:700;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* ── typing indicator (3 bobbing dots) ── */
.typing{display:inline-flex;gap:5px;padding:13px 14px;align-items:center;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;
  animation:bob 1.2s ease-in-out infinite;}
.typing span:nth-child(2){animation-delay:.18s;}
.typing span:nth-child(3){animation-delay:.36s;}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-5px);opacity:1;}}

/* ── suggested-prompt chips (pills) ── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;padding-left:34px;
  opacity:0;transform:translateY(4px);transition:opacity .35s ease-out,transform .35s ease-out;}
.chips.show{opacity:1;transform:none;}
.chip{font-size:12px;color:var(--text);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 13px;cursor:pointer;line-height:1.1;}
.chip:active{background:var(--card2);}

/* ── bottom input bar (above nav) ── */
.inbar{position:absolute;left:0;right:0;bottom:60px;display:flex;align-items:center;gap:9px;
  padding:9px 12px;background:rgba(26,23,20,.98);border-top:1px solid var(--line);}
.infield{flex:1;background:var(--card);border:1px solid var(--line);border-radius:999px;
  color:var(--text);font-size:13px;padding:11px 15px;outline:none;}
.infield::placeholder{color:var(--faint);}
.send{width:40px;height:40px;border-radius:50%;flex:none;background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#241200;}
.send i{font-size:20px;}
.send:active{background:var(--accentPress);}

/* the messages column needs head + input not to overlap nav stack */
.phone .nav{z-index:2;}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"><i></i></div>

  <!-- slim chat header -->
  <div class="chead">
    <div class="bavatar"><i class="ri-sparkling-2-fill"></i></div>
    <div class="grow">
      <div class="name">AI-бро</div>
      <div class="stat"><span class="dot"></span> онлайн</div>
    </div>
  </div>

  <!-- messages -->
  <div class="msgs" id="msgs">
    <!-- typing indicator + streamed opener injected by script -->
  </div>

  <!-- bottom input bar -->
  <div class="inbar">
    <input class="infield" placeholder="Напишіть питання…" disabled>
    <button class="send" aria-label="Надіслати"><i class="ri-arrow-up-line"></i></button>
  </div>

  <!-- bottom nav · FLAT LINE ICONS -->
  <div class="nav">
    <a><i class="ri-home-5-line"></i>Головна</a>
    <a><i class="ri-price-tag-3-line"></i>Можливості</a>
    <a class="on"><i class="ri-sparkling-2-fill"></i>AI-бро</a>
    <a><i class="ri-file-list-3-line"></i>Мої послуги</a>
  </div>
</div>

<div class="cap"><b>AI-бро · чат.</b> Індикатор набору, потім вітання
«стрімиться» по літерах із курсором — як токени LLM; далі зʼявляються три підказки-чипи.</div>

<script>
(function(){
  var msgs = document.getElementById('msgs');
  var OPENER = 'Привіт, я — твій цифровий бро. Підкажу по послугам від держави без «згідно-відповідно».';
  var CHIPS = ['Яка допомога мені належить?', 'Що таке Ветеран-бокс?', 'Знижки поруч'];

  // 1) typing indicator inside a bot bubble
  var typingRow = document.createElement('div');
  typingRow.className = 'brow';
  typingRow.innerHTML =
    '<div class="bmini"><i class="ri-sparkling-2-fill"></i></div>' +
    '<div class="bubble bot" style="padding:0"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(typingRow);

  // 2) after ~900ms, swap to a streaming bot bubble
  setTimeout(function(){
    msgs.removeChild(typingRow);

    var row = document.createElement('div');
    row.className = 'brow';
    var mini = document.createElement('div');
    mini.className = 'bmini';
    mini.innerHTML = '<i class="ri-sparkling-2-fill"></i>';
    var bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    var textSpan = document.createElement('span');
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.textContent = '▍';
    bubble.appendChild(textSpan);
    bubble.appendChild(cursor);
    row.appendChild(mini);
    row.appendChild(bubble);
    msgs.appendChild(row);

    // 3) reveal substring on an interval (~24ms/char, longer pause after . and ,)
    var i = 0;
    function step(){
      if(i >= OPENER.length){
        cursor.remove();
        showChips();
        return;
      }
      var ch = OPENER.charAt(i);
      textSpan.textContent = OPENER.slice(0, i + 1);
      msgs.scrollTop = msgs.scrollHeight;
      i++;
      var delay = 24;
      if(ch === '.') delay = 340;
      else if(ch === ',') delay = 200;
      setTimeout(step, delay);
    }
    setTimeout(step, 24);
  }, 900);

  // 4) suggested-prompt chips
  function showChips(){
    var wrap = document.createElement('div');
    wrap.className = 'chips';
    CHIPS.forEach(function(label){
      var b = document.createElement('button');
      b.className = 'chip';
      b.textContent = label;
      wrap.appendChild(b);
    });
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    requestAnimationFrame(function(){ wrap.classList.add('show'); });
  }
})();
</script>

</body>
</html>
